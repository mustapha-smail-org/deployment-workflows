name: 'Docker Build & Push'
description: 'Build a container image and push it to a registry, tagged by commit SHA'

inputs:
  service-name:
    description: 'Service name, used to build the image repository path'
    required: true
  registry:
    description: 'Container registry hostname'
    required: false
    default: 'ghcr.io'
  registry-namespace:
    description: 'Registry namespace/org (e.g. GitHub org). Defaults to the repository owner.'
    required: false
    default: ''
  image-tag-sha:
    description: 'Primary immutable tag for this build, e.g. sha-abc1234'
    required: true
  registry-username:
    description: 'Registry login username'
    required: true
  registry-password:
    description: 'Registry login password/token'
    required: true
  dockerfile-path:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'
  build-context:
    description: 'Docker build context'
    required: false
    default: '.'
  extra-tags:
    description: 'Comma-separated list of additional mutable tags (e.g. main,latest)'
    required: false
    default: ''

outputs:
  image-digest:
    description: 'Immutable OCI digest of the pushed image (sha256:...)'
    value: ${{ steps.build.outputs.digest }}
  image-repository:
    description: 'Full image repository path (registry/namespace/service)'
    value: ${{ steps.repo.outputs.image-repository }}
  image-tags:
    description: 'Comma-separated list of tags applied to the pushed image'
    value: ${{ steps.tags.outputs.all-tags }}

runs:
  using: 'composite'
  steps:
    - name: Resolve image repository
      id: repo
      shell: bash
      run: |
        NAMESPACE="${{ inputs.registry-namespace }}"
        if [ -z "$NAMESPACE" ]; then
          NAMESPACE="${{ github.repository_owner }}"
        fi
        NAMESPACE_LOWER=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
        echo "image-repository=${{ inputs.registry }}/${NAMESPACE_LOWER}/${{ inputs.service-name }}" >> "$GITHUB_OUTPUT"

    - name: Build tag list
      id: tags
      shell: bash
      run: |
        REPO="${{ steps.repo.outputs.image-repository }}"
        TAGS="${REPO}:${{ inputs.image-tag-sha }}"
        if [ -n "${{ inputs.extra-tags }}" ]; then
          IFS=',' read -ra EXTRA <<< "${{ inputs.extra-tags }}"
          for t in "${EXTRA[@]}"; do
            TAGS="${TAGS},${REPO}:${t}"
          done
        fi
        echo "all-tags=${TAGS}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

    - name: Log in to registry
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520c4 # v6
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile-path }}
        push: true
        tags: ${{ steps.tags.outputs.all-tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
