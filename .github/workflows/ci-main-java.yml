name: CI - Main (Java)

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name (used for the image repo path)'
        type: string
        required: true
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      sonar-project-key:
        description: 'SonarQube project key'
        type: string
        required: true
      sonar-project-name:
        description: 'SonarQube project display name'
        type: string
        required: true
      sonar-organization:
        description: 'SonarQube Cloud organization key'
        type: string
        default: ''
      sonar-host-url:
        description: 'SonarQube server URL'
        type: string
        default: 'https://sonarcloud.io'
      jacoco-threshold:
        description: 'Minimum line coverage percentage required (0-100)'
        type: string
        default: '70'
      working-directory:
        description: 'Directory containing the Maven project (pom.xml)'
        type: string
        default: '.'
      image-registry:
        description: 'Container registry hostname'
        type: string
        default: 'ghcr.io'
      dockerfile-path:
        description: 'Path to the Dockerfile'
        type: string
        default: './Dockerfile'
    secrets:
      sonar-token:
        description: 'SonarQube authentication token'
        required: true
    outputs:
      image-digest:
        description: 'Immutable OCI digest of the pushed image'
        value: ${{ jobs.image.outputs.image-digest }}
      image-tags:
        description: 'Tags applied to the pushed image'
        value: ${{ jobs.image.outputs.image-tags }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-main-${{ inputs.service-name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Maven verify (tests + coverage check)
        uses: mustapha-smail-org/deployment-workflows/.github/actions/maven-verify@main
        with:
          java-version: ${{ inputs.java-version }}
          jacoco-threshold: ${{ inputs.jacoco-threshold }}
          working-directory: ${{ inputs.working-directory }}

      - name: Sonar analysis + quality gate
        uses: mustapha-smail-org/deployment-workflows/.github/actions/sonar-analysis-maven@main
        with:
          sonar-host-url: ${{ inputs.sonar-host-url }}
          sonar-token: ${{ secrets.sonar-token }}
          sonar-project-key: ${{ inputs.sonar-project-key }}
          sonar-project-name: ${{ inputs.sonar-project-name }}
          sonar-organization: ${{ inputs.sonar-organization }}
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
      image-tags: ${{ steps.build.outputs.image-tags }}
      image-repository: ${{ steps.build.outputs.image-repository }}
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute short SHA
        id: sha
        run: echo "short=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: mustapha-smail-org/deployment-workflows/.github/actions/docker-build-push@main
        with:
          service-name: ${{ inputs.service-name }}
          registry: ${{ inputs.image-registry }}
          image-tag-sha: ${{ steps.sha.outputs.short }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerfile-path: ${{ inputs.dockerfile-path }}
          build-context: ${{ inputs.working-directory }}

